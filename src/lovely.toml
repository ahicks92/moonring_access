# MoonringAccess — Lovely patch manifest.
# Registers the mod's Lua as requireable modules, then boots once at the end of
# love.load, when every game global/class exists. Lovely only — no other loader.

[manifest]
version = "0.1.0"
priority = 0

# --- Register mod Lua as requireable modules. Lovely does NOT add the mod
#     folder to the require path, so every file we `require` needs a module
#     patch with an explicit name.
[[patches]]
[patches.module]
source = "ma_hooks.lua"
before = "main.lua"
name = "ma_hooks"

[[patches]]
[patches.module]
source = "ma_speech.lua"
before = "main.lua"
name = "ma_speech"

[[patches]]
[patches.module]
source = "ma_dev_server.lua"
before = "main.lua"
name = "ma_dev_server"

[[patches]]
[patches.module]
source = "ma_text.lua"
before = "main.lua"
name = "ma_text"

[[patches]]
[patches.module]
source = "ma_buffers.lua"
before = "main.lua"
name = "ma_buffers"

[[patches]]
[patches.module]
source = "ma_app.lua"
before = "main.lua"
name = "ma_app"

[[patches]]
[patches.module]
source = "ma_map.lua"
before = "main.lua"
name = "ma_map"

[[patches]]
[patches.module]
source = "ma_synth.lua"
before = "main.lua"
name = "ma_synth"

[[patches]]
[patches.module]
source = "ma_shapes.lua"
before = "main.lua"
name = "ma_shapes"

[[patches]]
[patches.module]
source = "ma_cursor.lua"
before = "main.lua"
name = "ma_cursor"

[[patches]]
[patches.module]
source = "ma_echo.lua"
before = "main.lua"
name = "ma_echo"

[[patches]]
[patches.module]
source = "ma_scanner.lua"
before = "main.lua"
name = "ma_scanner"

[[patches]]
[patches.module]
source = "ma_id.lua"
before = "main.lua"
name = "ma_id"

[[patches]]
[patches.module]
source = "ma_mb.lua"
before = "main.lua"
name = "ma_mb"

[[patches]]
[patches.module]
source = "ma_graph.lua"
before = "main.lua"
name = "ma_graph"

[[patches]]
[patches.module]
source = "ma_keygraph.lua"
before = "main.lua"
name = "ma_keygraph"

[[patches]]
[patches.module]
source = "ma_dispatcher.lua"
before = "main.lua"
name = "ma_dispatcher"

[[patches]]
[patches.module]
source = "ma_input.lua"
before = "main.lua"
name = "ma_input"

[[patches]]
[patches.module]
source = "ma_overlays.lua"
before = "main.lua"
name = "ma_overlays"

[[patches]]
[patches.module]
source = "moonring_access.lua"
before = "main.lua"
name = "moonring_access"

# --- Boot at the end of love.load (after the mouse handler init, the last
#     substantive statement). GameState has already switched to the title
#     screen; all widget classes and globals exist.
[[patches]]
[patches.pattern]
target = "main.lua"
pattern = "G_MouseHandler.initialise(G_DrawOffsetHorizontal + G_Globals.screenShakeX, G_DrawOffsetVertical + G_Globals.screenShakeY, gDrawScale)"
position = "after"
payload = "require('moonring_access').boot()"
match_indent = true
times = 1
